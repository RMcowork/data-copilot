<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Copilot</title>
  <script>var th="dark";try{if(localStorage.getItem("theme")==="light")th="light"}catch(e){}document.documentElement.dataset.theme=th</script>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
</head>
<body>
  <div id="login" class="modal hidden" role="dialog" aria-labelledby="login-title">
    <form id="login-form" class="card">
      <p class="kicker">DATA COPILOT</p>
      <h1 id="login-title">Sign in</h1>
      <label>Your name<input id="login-name" name="name" autocomplete="username" required minlength="2" maxlength="40" placeholder="Dana"></label>
      <label>Team password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Enter</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>


  <div id="add-dataset" class="modal hidden" role="dialog" aria-labelledby="add-title">
    <form id="add-form" class="card">
      <p id="add-kicker" class="kicker">ADD A DATASET</p>
      <h1 id="add-title">Bring your own data</h1>
      <div class="seg" role="tablist">
        <button type="button" id="mode-file" class="seg-btn active" role="tab">Upload a file</button>
        <button type="button" id="mode-link" class="seg-btn" role="tab">From a link</button>
      </div>
      <label id="file-field">CSV or Excel files (1 to 3)<input id="add-file" type="file" multiple accept=".csv,.tsv,.txt,.xlsx,.xlsm"></label>
      <label id="link-field" class="hidden">Links to CSV or Excel files (one per line, 1 to 3)<textarea id="add-url" rows="3" placeholder="https://… or a Google Sheets link"></textarea></label>
      <label id="name-field">Name (optional)<input id="add-name" maxlength="80" placeholder="e.g. Customers 2026"></label>
      <p id="add-hint" class="hint-text"></p>
      <div class="row">
        <button type="button" id="add-cancel" class="ghost">Cancel</button>
        <button type="submit" id="add-submit" class="primary">Add dataset</button>
      </div>
      <p id="add-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="rename-dataset" class="modal hidden" role="dialog" aria-labelledby="rename-title">
    <form id="rename-form" class="card">
      <p class="kicker">RENAME TAB</p>
      <h1 id="rename-title">Name this tab</h1>
      <label>Name<input id="rename-input" maxlength="80" required></label>
      <div class="row">
        <button type="button" id="rename-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
      <p id="rename-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="dot"></span>
        <div><strong>Data Copilot</strong><small id="who"></small></div>
      </div>
      <button id="new-chat" class="primary wide">+ New chat</button>
      <nav id="conversations" class="conversations" aria-label="Conversations"></nav>
      <div class="sidebar-foot">
        <button id="toggle-invoices" class="ghost">Invoices</button>
        <button id="toggle-theme" class="ghost" title="Switch between light and dark"></button>
        <button id="logout" class="ghost">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="conv-title">New chat</h2>
        <div class="actions">
          <span id="status" class="status"></span>
          <button id="add-files" class="ghost hidden" title="Add another file to this tab"></button>
          <div class="menu-wrap">
            <button id="export" class="ghost hidden" aria-haspopup="true" aria-expanded="false" title="Download or share this chat">Export ▾</button>
            <div id="export-menu" class="menu hidden" role="menu">
              <button role="menuitem" data-act="md">Download as Markdown (.md)</button>
              <button role="menuitem" data-act="html">Download as web page (.html)</button>
              <button role="menuitem" data-act="copy">Copy as text</button>
              <button role="menuitem" data-act="share" class="hidden">Share…</button>
            </div>
          </div>
        </div>
      </header>

      <nav id="tabs" class="tabs" aria-label="Datasets"></nav>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label id="attach" class="attach" title="Attach an invoice photo">
          <input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <span>📎</span>
        </label>
        <textarea id="input" rows="1" placeholder="Ask about your data…" required></textarea>
        <button id="send" type="submit" class="primary">Send</button>
      </form>
      <p id="attachment" class="attachment hidden"></p>
    </main>

    <aside id="invoices" class="panel hidden" aria-label="Recent invoices">
      <header><h3>Recent invoices</h3><button id="close-invoices" class="ghost">✕</button></header>
      <table>
        <thead><tr><th>Date</th><th>Supplier</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody id="invoice-rows"></tbody>
      </table>
    </aside>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
